# Render Blueprint for the Kairos API and its PostgreSQL database.
#
# COST: both resources use Render's free plans. A free web service sleeps
# after a period without traffic (the first request then takes up to about a
# minute), and a free PostgreSQL database is deleted after a limited period
# unless it is upgraded to a paid plan. Check render.com/pricing for the
# current terms before relying on this for real data. Changing either `plan`
# below to a paid plan incurs a monthly charge.
services:
  - type: web
    name: kairos-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: kairos-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: kairos-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: kairos-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: kairos-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: kairos-db
          property: password
      # Random 256-bit signing key generated by Render; never committed
      - key: KAIROS_JWT_SECRET
        generateValue: true
      # Set in the dashboard to the Vercel production URL, e.g. https://kairos.vercel.app
      - key: KAIROS_CORS_ORIGINS
        sync: false

databases:
  - name: kairos-db
    plan: free
    databaseName: kairos
    user: kairos
    postgresMajorVersion: "17"
    ipAllowList: []   # reachable only from Render services on the private network
