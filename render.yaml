# Render Blueprint for the Kairos API.
#
# The API uses the existing Render PostgreSQL database "Kairos-db" (Oregon),
# which is NOT managed by this Blueprint: this file never creates, changes or
# deletes a database. Its connection values are entered privately in the
# Render dashboard (see README, "Deploy to Render") and are never committed.
#
# COST: the web service uses Render's free plan, which sleeps after 15 minutes
# without traffic (the next request takes about a minute). Kairos-db's own
# plan and expiry are managed on the database itself. Changing `plan` below
# to a paid plan incurs a monthly charge.
services:
  - type: web
    name: kairos-backend
    runtime: docker
    plan: free
    # Must match Kairos-db's region so the internal database hostname resolves
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Kairos-db connection, from Kairos-db → Info → Connections (internal values).
      # sync: false means Render asks for these in the dashboard instead of reading them from git.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Random 256-bit signing key generated by Render; never committed
      - key: KAIROS_JWT_SECRET
        generateValue: true
      # The frontend's production URL, e.g. https://kairos-frontend.vercel.app (no trailing slash)
      - key: KAIROS_CORS_ORIGINS
        sync: false
